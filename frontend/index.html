            'on-primary-fixed-variant': '#004b73',
            'secondary': '#5a5e6a',

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f8f9ff;
      color: #0b1c30;
      font-family: 'Plus Jakarta Sans', sans-serif;
      overflow-x: hidden;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
      font-size: 18px;
    }
    .ms-filled { font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: #eff4ff; }
    ::-webkit-scrollbar-thumb { background: #bfc7d2; border-radius: 2px; }

    /* Glassmorphism card */
    .glass-card {
      background: #ffffff;
      box-shadow: 0 4px 14px rgba(11, 28, 48, 0.08);
      border: 1px solid #e5eeff;
      border-radius: 12px;
    }

    /* Tab active indicator */
    .tab-active {
      background: #dce9ff;
      border-bottom: 2px solid #006194;
      color: #006194;
    }
    .tab-inactive {
      border-bottom: 2px solid transparent;
      color: #707881;
    }
    .tab-inactive:hover {
      color: #0b1c30;
      background: #eff4ff;
    }

    /* Risk badge */
    .risk-high { background: #ffdad6; color: #93000a; border: 1px solid #ffb4ab; }
    .risk-moderate { background: #ffdfa5; color: #6f4f00; border: 1px solid #e5bd63; }
    .risk-low { background: #acedff; color: #004e5c; border: 1px solid #4cd7f6; }

    /* HUD scanline overlay */
    .hud-scanline::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 3px,
        rgba(0,97,148,0.025) 3px,
        rgba(0,97,148,0.025) 4px
      );
      pointer-events: none;
      border-radius: inherit;
    }

    /* Glow effects */
    .glow-cyan { box-shadow: 0 4px 18px rgba(0,97,148,0.18); }
    .glow-green { box-shadow: 0 4px 18px rgba(0,101,119,0.16); }
    .glow-red { box-shadow: 0 4px 18px rgba(186,26,26,0.16); }

    @media (max-width: 900px) {
      header { flex-wrap: wrap; }
      header > .ml-auto { margin-left: 0; width: 100%; justify-content: flex-end; }
      nav { overflow-x: auto; }
      main { padding: 1rem; }
      main .col-span-3, main .col-span-4, main .col-span-5, main .col-span-7, main .col-span-12 {
        grid-column: span 12 / span 12;
      }
    }

    /* Animated recording dot */
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    .blink { animation: blink 1s ease-in-out infinite; }

    /* Slide-in drawer */
    .drawer-open { transform: translateX(0); }
    .drawer-closed { transform: translateX(100%); }
    .drawer-transition { transition: transform 0.3s ease-in-out; }

    /* Print Styles for Clinical Dossier */
    @media print {
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt;
      }
      header, footer, nav, .print\:hidden, button, input[type="range"] {
        display: none !important;
      }
      main {
        padding: 0 !important;
        max-width: 100% !important;
      }
      .bg-inverse-surface {
        background: #f1f5f9 !important;
        color: #0f172a !important;
        border: 1px solid #cbd5e1 !important;
      }
      .text-surface-container-lowest {
        color: #0f172a !important;
      }
      .text-surface-dim {
        color: #475569 !important;
      }
      .shadow-sm, .shadow-md, .shadow-2xl, .shadow-lg {
        box-shadow: none !important;
      }
      .border, .border-b, .border-t, .border-l-4 {
        border-color: #cbd5e1 !important;
      }
      @page {
        margin: 1.2cm;
        size: A4 portrait;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
